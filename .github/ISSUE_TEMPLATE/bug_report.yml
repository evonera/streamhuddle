name: Bug report
description: Report a reproducible problem in StreamHuddle.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, do not use this public form. Follow [SECURITY.md](https://github.com/evonera/streamhuddle/blob/main/SECURITY.md).
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the page, actions, and relevant browser or operating system.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or console errors after removing personal data and secrets.
    validations:
      required: false
